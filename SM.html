<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef2f7;
}

/* Login */

.container{
    width:380px;
    background:#fff;
    margin:70px auto;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#333;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

button{
    width:100%;
    padding:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

/* Dashboard */

#dashboard{
    display:none;
    width:90%;
    margin:30px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logout{
    width:100px;
    background:red;
}

.logout:hover{
    background:darkred;
}

.addBox{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

table th{
    background:#007bff;
    color:white;
}

table th,
table td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

.deleteBtn{
    background:red;
    padding:6px 12px;
    border:none;
    color:white;
    border-radius:4px;
    cursor:pointer;
}

.deleteBtn:hover{
    background:darkred;
}

#msg{
    text-align:center;
    color:red;
    margin-top:10px;
}
</style>

</head>
<body>

<!-- Login Page -->

<div class="container" id="loginPage">

<h2>Student Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<!-- Dashboard -->

<div id="dashboard">

<div class="header">

<h2>Student Management System</h2>

<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="addBox">

<input type="text" id="name" placeholder="Student Name">

<input type="text" id="roll" placeholder="Roll Number">

<input list="courses" id="course" placeholder="Select or Type Course">

<datalist id="courses">

<option value="B.Sc Computer Science">
<option value="B.Sc Mathematics">
<option value="B.Sc Physics">
<option value="B.Sc Chemistry">
<option value="BCA">
<option value="B.Com">
<option value="BBA">
<option value="BA English">
<option value="BA History">
<option value="BA Economics">
<option value="B.Tech Computer Science">
<option value="B.Tech Information Technology">
<option value="B.Tech Artificial Intelligence">
<option value="B.Tech Data Science">
<option value="B.Tech Cyber Security">
<option value="B.Tech Electronics & Communication">
<option value="B.Tech Electrical Engineering">
<option value="B.Tech Mechanical Engineering">
<option value="B.Tech Civil Engineering">
<option value="MCA">
<option value="MBA">
<option value="M.Sc Computer Science">
<option value="M.Com">

</datalist>

<button onclick="addStudent()">Add Student</button>

</div>

<table>

<thead>

<tr>

<th>Name</th>
<th>Roll No</th>
<th>Course</th>
<th>Action</th>

</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

<script>

function login(){

let username=document.getElementById("username").value;
let password=document.getElementById("password").value;

if(username=="admin" && password=="1234"){

document.getElementById("loginPage").style.display="none";
document.getElementById("dashboard").style.display="block";

}else{

document.getElementById("msg").innerHTML="Invalid Username or Password";

}

}

function logout(){

document.getElementById("dashboard").style.display="none";
document.getElementById("loginPage").style.display="block";

document.getElementById("username").value="";
document.getElementById("password").value="";
document.getElementById("msg").innerHTML="";

}

function addStudent(){

let name=document.getElementById("name").value.trim();
let roll=document.getElementById("roll").value.trim();
let course=document.getElementById("course").value.trim();

if(name=="" || roll=="" || course==""){

alert("Please fill all fields.");

return;

}

let table=document.getElementById("studentTable");

let row=table.insertRow();

row.insertCell(0).innerHTML=name;
row.insertCell(1).innerHTML=roll;
row.insertCell(2).innerHTML=course;

let action=row.insertCell(3);

action.innerHTML="<button class='deleteBtn' onclick='deleteStudent(this)'>Delete</button>";

document.getElementById("name").value="";
document.getElementById("roll").value="";
document.getElementById("course").value="";

}

function deleteStudent(button){

let row=button.parentNode.parentNode;

row.remove();

}

</script>

</body>
</html>
