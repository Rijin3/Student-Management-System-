<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="icon" type="image/x-icon"
        href="https://camo.githubusercontent.com/4150fb7ee8b95a92c1870a6b13e70c0616b377b58ef3df2b79cea082b58c1145/68747470733a2f2f63646e2d69636f6e732d706e672e666c617469636f6e2e636f6d2f3531322f3139342f3139343933312e706e67">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <section class="hero">
            <img src="https://img.icons8.com/fluency/120/student-registration.png"
                alt="Student illustration" class="hero-image">
            <div>
                <h1>Student Management System</h1>
                <p>Login and manage student records in a clean, responsive dashboard.</p>
            </div>
        </section>

        <div class="container" id="loginPage">
            <div class="card-header">
                <img src="https://img.icons8.com/ios-filled/48/school.png" alt="School icon"
                    class="card-icon">
                <h2>Student Login</h2>
            </div>

            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="msg"></p>
        </div>

        <div id="dashboard">
            <div class="header">
                <div class="title-group">
                    <img src="https://img.icons8.com/fluency/48/student-center.png" alt="Dashboard icon"
                        class="header-icon">
                    <div>
                        <h2>Student Dashboard</h2>
                        <p>Easy student record management.</p>
                    </div>
                </div>
                <button class="logout" onclick="logout()">Logout</button>
            </div>

            <div class="addBox">
                <div class="section-title">
                    <img src="https://img.icons8.com/fluency/24/add-user-male.png" alt="Add student"
                        class="section-icon">
                    <h3>Add New Student</h3>
                </div>

                <input type="text" id="name" placeholder="Student Name">
                <input type="text" id="roll" placeholder="Roll Number">
                <input list="courses" id="course" placeholder="Select or Type Course">
                <datalist id="courses">
                    <option value="B.Sc Computer Science">
                    <option value="B.Sc Mathematics">
                    <option value="B.Sc Physics">
                    <option value="B.Sc Chemistry">
                    <option value="BCA">
                    <option value="B.Com">
                    <option value="BBA">
                    <option value="BA English">
                    <option value="BA History">
                    <option value="BA Economics">
                    <option value="B.Tech Computer Science">
                    <option value="B.Tech Information Technology">
                    <option value="B.Tech Artificial Intelligence">
                    <option value="B.Tech Data Science">
                    <option value="B.Tech Cyber Security">
                    <option value="B.Tech Electronics & Communication">
                    <option value="B.Tech Electrical Engineering">
                    <option value="B.Tech Mechanical Engineering">
                    <option value="B.Tech Civil Engineering">
                    <option value="MCA">
                    <option value="MBA">
                    <option value="M.Sc Computer Science">
                    <option value="M.Com">
                </datalist>

                <button onclick="addStudent()">Add Student</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll No</th>
                            <th>Course</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (username === 'admin' && password === '1234') {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('msg').textContent = '';
            } else {
                document.getElementById('msg').textContent = 'Invalid Username or Password';
            }
        }

        function logout() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('msg').textContent = '';
        }

        function addStudent() {
            const name = document.getElementById('name').value.trim();
            const roll = document.getElementById('roll').value.trim();
            const course = document.getElementById('course').value.trim();

            if (name === '' || roll === '' || course === '') {
                alert('Please fill all fields.');
                return;
            }

            const table = document.getElementById('studentTable');
            const row = table.insertRow();
            row.insertCell(0).textContent = name;
            row.insertCell(1).textContent = roll;
            row.insertCell(2).textContent = course;
            const actionCell = row.insertCell(3);
            actionCell.innerHTML = "<button class='deleteBtn' onclick='deleteStudent(this)'>Delete</button>";

            document.getElementById('name').value = '';
            document.getElementById('roll').value = '';
            document.getElementById('course').value = '';
        }

        function deleteStudent(button) {
            const row = button.closest('tr');
            if (row) row.remove();
        }
    </script>

    projectId: "student-management-syste-9498d",
    storageBucket: "student-management-syste-9498d.firebasestorage.app",
    messagingSenderId: "433747294105",
    appId: "1:433747294105:web:c3a97ad43b79a4312ec508",
    measurementId: "G-ESQQY7M6RM"

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>
</body>
</html>
